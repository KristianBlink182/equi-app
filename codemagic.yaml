workflows:
  ios-release:
    name: Equi iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Equi
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias
        script: |
          npm install --legacy-peer-deps
      - name: Prebuild nativo Expo
        script: |
          npx expo prebuild --platform ios --clean
      - name: Limpiar Entitlements conflictivos
        script: |
          # Elimina el requerimiento de APNs que bloquea la firma
          if [ -f ios/Equi/Equi.entitlements ]; then
            sed -i '' '/aps-environment/,+1d' ios/Equi/Equi.entitlements || true
          fi
      - name: Instalar CocoaPods
        script: |
          cd ios && pod install
      - name: Sincronizar Certificados Apple
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.equi.saludapp" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Compilar y Empaquetar IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/Equi.xcworkspace" \
            --scheme "Equi"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true