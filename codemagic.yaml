workflows:
  ios-release:
    name: Equi iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Equi
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias
        script: |
          npm install --legacy-peer-deps
      - name: Prebuild nativo Expo
        script: |
          npx expo prebuild --platform ios --clean
      - name: Instalar CocoaPods
        script: |
          cd ios && pod install
      - name: Descargar certificados y perfiles de Apple
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.equi.saludapp" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Compilar App Nativa (.ipa)
        script: |
          cd ios
          xcodebuild -workspace Equi.xcworkspace \
            -scheme Equi \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/Equi.xcarchive \
            archive \
            DEVELOPMENT_TEAM="4R75VHFBHA"
          
          cat <<EOF > export_options.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>4R75VHFBHA</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.equi.saludapp</key>
                  <string>Equi AppStore Profile</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \