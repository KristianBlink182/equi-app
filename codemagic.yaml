workflows:
  ios-release:
    name: Equi iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Equi
    environment:
      ios_signing:
        provisioning_profiles:
          - Equi AppStore Profile
        certificates:
          - Equi Certi
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias
        script: |
          npm install --legacy-peer-deps
      - name: Prebuild nativo Expo
        script: |
          npx expo prebuild --platform ios --clean
      - name: Instalar CocoaPods
        script: |
          cd ios && pod install
      - name: Configurar firma de perfiles
        script: |
          xcode-project use-profiles
      - name: Compilar y Empaquetar IPA
        script: |
          cd ios
          xcodebuild -workspace Equi.xcworkspace \
            -scheme Equi \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/Equi.xcarchive \
            archive
          
          mkdir -p ../build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath build/Equi.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath ../build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true