workflows:
  # 1. FLUJO IOS TESTFLIGHT
  ios-release:
    name: Equi iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Equi
    environment:
      ios_signing:
        provisioning_profiles:
          - Equi AppStore Profile
        certificates:
          - Equi Certi
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias
        script: |
          npm install --legacy-peer-deps
      - name: Prebuild nativo Expo
        script: |
          npx expo prebuild --platform ios --clean
      - name: Instalar CocoaPods
        script: |
          cd ios && pod install
      - name: Configurar firma de perfiles
        script: |
          xcode-project use-profiles
      - name: Compilar y Empaquetar IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/Equi.xcworkspace" \
            --scheme "Equi"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # 2. FLUJO ANDROID GOOGLE PLAY (.AAB)
  android-release:
    name: Equi Android Release (AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
    scripts:
      - name: Instalar dependencias
        script: |
          npm install --legacy-peer-deps
      - name: Prebuild nativo Android
        script: |
          npx expo prebuild --platform android --clean
      - name: Compilar Android App Bundle (.aab)
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk