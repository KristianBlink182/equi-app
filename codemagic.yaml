workflows:
  ios-release:
    name: Equi iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Instalar dependencias
        script: |
          npm install
      - name: Generar proyecto nativo iOS
        script: |
          npx expo prebuild --platform ios --clean
      - name: Instalar CocoaPods
        script: |
          cd ios && pod install
      - name: Compilar App (.ipa)
        script: |
          cd ios
          xcodebuild -workspace Equi.xcworkspace \
            -scheme Equi \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/Equi.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO
          
          mkdir -p ../build/ios/ipa
          cd build
          mkdir -p Payload
          cp -r Equi.xcarchive/Products/Applications/Equi.app Payload/
          zip -r ../../../build/ios/ipa/Equi.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa